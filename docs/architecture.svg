<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f7f7f7"/>
  <text x="48" y="56" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#222">Vacation-rental marketplace  production architecture</text>
  <text x="48" y="86" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6a6a6a">Scaling strategy for frontend, backend, storage, search, and deployment</text>

  <!-- Users -->
  <rect x="48" y="120" width="200" height="90" rx="16" fill="#fff" stroke="#ddd"/>
  <text x="148" y="158" text-anchor="middle" font-family="Inter, Arial" font-size="14" font-weight="700">Guests / Hosts</text>
  <text x="148" y="180" text-anchor="middle" font-family="Inter, Arial" font-size="12" fill="#6a6a6a">Web, iOS, Android</text>

  <!-- Edge -->
  <rect x="300" y="110" width="320" height="110" rx="16" fill="#fff5f7" stroke="#ff385c"/>
  <text x="460" y="142" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="700" fill="#ff385c">Edge / Frontend</text>
  <text x="460" y="166" text-anchor="middle" font-family="Inter, Arial" font-size="12">CDN + image optimizer (Vercel / CloudFront)</text>
  <text x="460" y="186" text-anchor="middle" font-family="Inter, Arial" font-size="12">SSR listing pages, static shells, WAF</text>

  <!-- API -->
  <rect x="680" y="110" width="300" height="110" rx="16" fill="#fff" stroke="#222"/>
  <text x="830" y="142" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="700">API gateway</text>
  <text x="830" y="166" text-anchor="middle" font-family="Inter, Arial" font-size="12">TLS, auth, rate limits, routing</text>
  <text x="830" y="186" text-anchor="middle" font-family="Inter, Arial" font-size="12">Multi-region Anycast</text>

  <!-- Backend -->
  <rect x="48" y="280" width="1304" height="240" rx="20" fill="#fff" stroke="#ddd"/>
  <text x="72" y="314" font-family="Inter, Arial" font-size="16" font-weight="700">Backend services (Kubernetes, 3 regions)</text>
  <rect x="72" y="336" width="220" height="150" rx="12" fill="#f7f7f7"/>
  <text x="182" y="368" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">Listing service</text>
  <text x="182" y="392" text-anchor="middle" font-family="Inter, Arial" font-size="12">Read replicas</text>
  <text x="182" y="412" text-anchor="middle" font-family="Inter, Arial" font-size="12">CQRS for writes</text>
  <rect x="312" y="336" width="220" height="150" rx="12" fill="#f7f7f7"/>
  <text x="422" y="368" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">Search service</text>
  <text x="422" y="392" text-anchor="middle" font-family="Inter, Arial" font-size="12">OpenSearch cluster</text>
  <text x="422" y="412" text-anchor="middle" font-family="Inter, Arial" font-size="12">Geo + filters + ranking</text>
  <rect x="552" y="336" width="220" height="150" rx="12" fill="#f7f7f7"/>
  <text x="662" y="368" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">Availability</text>
  <text x="662" y="392" text-anchor="middle" font-family="Inter, Arial" font-size="12">Calendar shards</text>
  <text x="662" y="412" text-anchor="middle" font-family="Inter, Arial" font-size="12">Redis locks</text>
  <rect x="792" y="336" width="220" height="150" rx="12" fill="#f7f7f7"/>
  <text x="902" y="368" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">Media service</text>
  <text x="902" y="392" text-anchor="middle" font-family="Inter, Arial" font-size="12">S3 / GCS + CDN</text>
  <text x="902" y="412" text-anchor="middle" font-family="Inter, Arial" font-size="12">Derivatives / WebP</text>
  <rect x="1032" y="336" width="280" height="150" rx="12" fill="#f7f7f7"/>
  <text x="1172" y="368" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">Async workers</text>
  <text x="1172" y="392" text-anchor="middle" font-family="Inter, Arial" font-size="12">Kafka / SQS</text>
  <text x="1172" y="412" text-anchor="middle" font-family="Inter, Arial" font-size="12">Reviews, pricing, ML features</text>

  <!-- Data -->
  <rect x="48" y="560" width="850" height="200" rx="20" fill="#fff" stroke="#ddd"/>
  <text x="72" y="594" font-family="Inter, Arial" font-size="16" font-weight="700">Storage / Database</text>
  <rect x="72" y="616" width="240" height="110" rx="12" fill="#f7f7f7"/>
  <text x="192" y="650" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">MongoDB Atlas</text>
  <text x="192" y="674" text-anchor="middle" font-family="Inter, Arial" font-size="12">Listing docs, reviews</text>
  <text x="192" y="694" text-anchor="middle" font-family="Inter, Arial" font-size="12">Replica set + backups</text>
  <rect x="332" y="616" width="240" height="110" rx="12" fill="#f7f7f7"/>
  <text x="452" y="650" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">PostgreSQL</text>
  <text x="452" y="674" text-anchor="middle" font-family="Inter, Arial" font-size="12">Bookings, money, users</text>
  <text x="452" y="694" text-anchor="middle" font-family="Inter, Arial" font-size="12">Citus / read replicas</text>
  <rect x="592" y="616" width="280" height="110" rx="12" fill="#f7f7f7"/>
  <text x="732" y="650" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="700">Redis + Object storage</text>
  <text x="732" y="674" text-anchor="middle" font-family="Inter, Arial" font-size="12">Session, hot calendars</text>
  <text x="732" y="694" text-anchor="middle" font-family="Inter, Arial" font-size="12">Photos in S3, metadata in DB</text>

  <rect x="922" y="560" width="430" height="200" rx="20" fill="#fff" stroke="#ddd"/>
  <text x="946" y="594" font-family="Inter, Arial" font-size="16" font-weight="700">Deployment</text>
  <text x="946" y="630" font-family="Inter, Arial" font-size="13">" GitHub Actions ’ build, test, visual snapshot</text>
  <text x="946" y="654" font-family="Inter, Arial" font-size="13">" Frontend: Vercel preview + prod</text>
  <text x="946" y="678" font-family="Inter, Arial" font-size="13">" API: EKS / GKE, HPA on p95 latency</text>
  <text x="946" y="702" font-family="Inter, Arial" font-size="13">" Blue/green + canary (5% ’ 25% ’ 100%)</text>
  <text x="946" y="726" font-family="Inter, Arial" font-size="13">" Observability: OpenTelemetry, Grafana</text>

  <text x="48" y="810" font-family="Inter, Arial" font-size="13" fill="#3f3f3f">Search path: typed query ’ edge cache ’ search service ’ OpenSearch geo index ’ ranking features ’ listing cards. Listing path: CDN HTML + API cache (Redis) + Mongo secondary.</text>
  <text x="48" y="834" font-family="Inter, Arial" font-size="13" fill="#3f3f3f">This take-home ships a single-region Express API and optional Mongo, which maps to the Listing service + Mongo box above.</text>
</svg>
